# WBTimeAI · pnpm workspace（V0.0.2）
#
# 本版与 V0.0.1 的差异只有一处：`packages/e2e` **已真实存在**（不是占位目录树）。
#   * `packages/e2e` = Node 内置 `node:test` 直打真端口的 e2e runner，
#     `dependencies` / `devDependencies` 均为空对象（零依赖是 S-1 判据成立的前提）；
#   * S-1 的扫描根 `packages/*/tests/e2e/**` 正是靠这个真实包变非空的 —— 扫描对象
#     必须先是真实文件，才谈得上"范围内不含 msw"是有意义为真（§1.7.2）；
#   * 仍然**没有** `apps/` 目录树：V0.0.2 不写 TS 业务代码，`apps/*` 只是登记
#     后续版本（V0.1.0 起）会用的 glob，不建空目录充数。
packages:
  - "packages/*"
  - "apps/*"
