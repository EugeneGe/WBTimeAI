# Alembic configuration (database migrations)
#
# NOTE: The actual DB URL is read from astra_config.get_settings() by
#       migrations/env.py. The sqlalchemy.url below is a placeholder fallback.
# NOTE: Keep this file ASCII-only (configparser reads it with the locale codec).

[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os
sqlalchemy.url = sqlite:///./astra_local.db

[post_write_hooks]

# ---------------------------------------------------------------------------
# Logging configuration (required by env.py's fileConfig call)
# ---------------------------------------------------------------------------
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
