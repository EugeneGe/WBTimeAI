[project]
name = "astra-workflow"
version = "0.4.0"
description = "Astra AI Workflow 能力包（Workflow / Version / Node / Edge / Run；领域实现归 T2-20 起）"
requires-python = ">=3.12"
# 能力包 → 抽象包（仿 mcp→tool，W4 裁定 §6.2 / R6）：
#   database（T2-20 ORM 落点）/ runtime + tool（T2-23，仅 engine/runtime_bridge 用）
#   / event（T2-24 事件出口）/ task（T2-24 异步 TaskQueue 路径）。
dependencies = [
    "astra-common",
    "astra-core",
    "astra-domain",
    "astra-database",
    "astra-runtime",
    "astra-tool",
    "astra-event",
    "astra-task",
]

[tool.uv.sources]
astra-common = { workspace = true }
astra-core = { workspace = true }
astra-domain = { workspace = true }
astra-database = { workspace = true }
astra-runtime = { workspace = true }
astra-tool = { workspace = true }
astra-event = { workspace = true }
astra-task = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/astra_workflow"]
