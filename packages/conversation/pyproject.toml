[project]
name = "astra-conversation"
version = "0.4.0"
description = "Astra AI Conversation 组能力包（Conversation/Message/AgentRun/ToolCall/AgentEvent SQL 仓储 + 服务）"
requires-python = ">=3.12"
dependencies = [
    "astra-common",
    "astra-core",
    "astra-domain",
    "astra-database",
    "astra-event",
    "astra-task",
]

[tool.uv.sources]
astra-common = { workspace = true }
astra-core = { workspace = true }
astra-domain = { workspace = true }
astra-database = { workspace = true }
astra-event = { workspace = true }
astra-task = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/astra_conversation"]
