[project]
name = "astra-security"
version = "0.4.0"
description = "Astra AI 认证与密钥安全（密码哈希 / JWT / AES-GCM / SecretProvider / 可撤销 Session）"
requires-python = ">=3.12"
dependencies = [
    "astra-common",
    "astra-core",
    "astra-domain",
    "astra-database",
    "argon2-cffi>=23.1.0",
    "pyjwt>=2.9.0",
    "cryptography>=42.0.0",
]

[tool.uv.sources]
astra-common = { workspace = true }
astra-core = { workspace = true }
astra-domain = { workspace = true }
astra-database = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/astra_security"]
