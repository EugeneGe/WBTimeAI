[project]
name = "astra-core"
version = "0.4.0"
description = "Astra AI 基础模块（统一 ID / Result / 错误基类 / 领域事件）"
requires-python = ">=3.12"
dependencies = [
    "astra-common",
    "uuid-utils>=0.9.0",
]

[tool.uv.sources]
astra-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/astra_core"]
