[project]
name = "astra-memory"
version = "0.4.0"
description = "Astra AI Memory 能力包（Memory / MemoryRelation / MemoryManager / MemoryStore；W6 / T2-32 起）"
requires-python = ">=3.12"
dependencies = [
    "astra-common",
    "astra-core",
    "astra-domain",
    "astra-database",
    "astra-model",
]

[tool.uv.sources]
astra-common = { workspace = true }
astra-core = { workspace = true }
astra-domain = { workspace = true }
astra-database = { workspace = true }
astra-model = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/astra_memory"]
