[project]
name = "astra-database"
version = "0.4.0"
description = "Astra AI 数据库层（SQLAlchemy 会话 / Repository / 方言适配 / ORM models）"
requires-python = ">=3.12"
dependencies = [
    "astra-common",
    "astra-core",
    "astra-config",
    "astra-domain",
    "astra-task",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13.0",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2.0"]

[tool.uv.sources]
astra-common = { workspace = true }
astra-core = { workspace = true }
astra-config = { workspace = true }
astra-domain = { workspace = true }
astra-task = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/astra_database"]
