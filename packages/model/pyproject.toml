[project]
name = "astra-model"
version = "0.4.0"
description = "Astra AI 模型 Provider 接口（ModelProvider Protocol + 注册表 + Stub）"
requires-python = ">=3.12"
dependencies = [
    "astra-common",
    "astra-core",
    "astra-domain",
    "httpx>=0.27.0",
]

[tool.uv.sources]
astra-common = { workspace = true }
astra-core = { workspace = true }
astra-domain = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/astra_model"]
