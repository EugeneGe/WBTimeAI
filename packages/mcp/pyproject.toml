[project]
name = "astra-mcp"
version = "0.4.0"
description = "Astra AI MCP 能力包（MCPServer / MCPTool / MCPPermission；领域实现归 T2-10 起）"
requires-python = ">=3.12"
dependencies = [
    "astra-common",
    "astra-core",
    "astra-domain",
    "astra-tool",
    "astra-database",
]

[project.optional-dependencies]
# 官方 MCP Python SDK（R7）：仅函数级延迟导入，保 astra_mcp 无 SDK 可导入。
mcp = ["mcp>=1.0,<2"]

[tool.uv.sources]
astra-common = { workspace = true }
astra-core = { workspace = true }
astra-domain = { workspace = true }
astra-tool = { workspace = true }
astra-database = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/astra_mcp"]
