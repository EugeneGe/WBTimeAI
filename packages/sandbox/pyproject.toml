[project]
name = "astra-sandbox"
version = "0.4.0"
description = "Astra AI Sandbox 抽象层（SandboxProvider Protocol + Docker/LocalProcess 实现）"
requires-python = ">=3.12"
dependencies = [
    "astra-common",
    "astra-core",
    "astra-domain",
]

[project.optional-dependencies]
docker = ["docker>=7.0"]

[tool.uv.sources]
astra-common = { workspace = true }
astra-core = { workspace = true }
astra-domain = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/astra_sandbox"]
