[project]
name = "astra-evaluation"
version = "0.4.0"
description = "Astra AI Evaluation 能力包（Dataset/Case/Run/Result + 批量执行 + 确定性 scorer；W9 / T2-45 起）"
requires-python = ">=3.12"
dependencies = [
    "astra-common",
    "astra-core",
    "astra-domain",
    "astra-database",
]

[tool.uv.sources]
astra-common = { workspace = true }
astra-core = { workspace = true }
astra-domain = { workspace = true }
astra-database = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/astra_evaluation"]
