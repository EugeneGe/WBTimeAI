[project]
name = "astra-skill"
version = "0.4.0"
description = "Astra AI Skill 能力包（Skill / SkillVersion / SkillResource / AgentSkill；领域实现归 T2-07 起）"
requires-python = ">=3.12"
dependencies = [
    "astra-common",
    "astra-core",
    "astra-domain",
    "astra-storage",
    "astra-database",
    "pyyaml>=6.0.0",
]

[tool.uv.sources]
astra-common = { workspace = true }
astra-core = { workspace = true }
astra-domain = { workspace = true }
astra-storage = { workspace = true }
astra-database = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/astra_skill"]
