[project]
name = "astra-tool"
version = "0.4.0"
description = "Astra AI Tool 统一接口（Tool Protocol + ToolRegistry + 首批内置工具 + Tool Permission）"
requires-python = ">=3.12"
dependencies = [
    "astra-common",
    "astra-core",
    "astra-domain",
]

[tool.uv.sources]
astra-common = { workspace = true }
astra-core = { workspace = true }
astra-domain = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/astra_tool"]
