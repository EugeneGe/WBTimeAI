[project]
name = "astra-domain"
version = "0.4.0"
description = "Astra AI 领域内核（实体 / 值对象 / 仓储接口 / 事件基类重导出；零框架依赖）"
requires-python = ">=3.12"
dependencies = [
    "astra-common",
    "astra-core",
]

[tool.uv.sources]
astra-common = { workspace = true }
astra-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/astra_domain"]
