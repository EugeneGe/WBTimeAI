[project]
name = "astra-config"
version = "0.4.0"
description = "Astra AI 配置层与 Provider 自动装配（决策 D4；含 retention.* 保留策略配置）"
requires-python = ">=3.12"
dependencies = [
    "astra-common",
    "astra-core",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "pyyaml>=6.0.0",
]

[tool.uv.sources]
astra-common = { workspace = true }
astra-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/astra_config"]
