[project]
name = "astra-storage"
version = "0.4.0"
description = "Astra AI 文件存储抽象（Storage 接口 + LocalFileStorage）"
requires-python = ">=3.12"
dependencies = [
    "astra-common",
    "astra-core",
]

[tool.uv.sources]
astra-common = { workspace = true }
astra-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/astra_storage"]
