[project]
name = "astra-identity"
version = "0.4.0"
description = "Astra AI 身份与多租户（SQLAlchemy 仓储实现 + 领域服务 + 默认身份引导）"
requires-python = ">=3.12"
dependencies = [
    "astra-common",
    "astra-core",
    "astra-domain",
    "astra-database",
]

[tool.uv.sources]
astra-common = { workspace = true }
astra-core = { workspace = true }
astra-domain = { workspace = true }
astra-database = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/astra_identity"]
