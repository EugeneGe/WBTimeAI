[project]
name = "astra-workspace"
version = "0.4.0"
description = "Astra AI 工作区能力包（Workspace 实体持久化 + 领域服务）"
requires-python = ">=3.12"
dependencies = [
    "astra-common",
    "astra-core",
    "astra-domain",
    "astra-database",
]

[tool.uv.sources]
astra-common = { workspace = true }
astra-core = { workspace = true }
astra-domain = { workspace = true }
astra-database = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/astra_workspace"]
