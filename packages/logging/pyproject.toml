[project]
name = "astra-logging"
version = "0.4.0"
description = "Astra AI 结构化日志（Metrics / Tracing 预留）"
requires-python = ">=3.12"
dependencies = [
    "astra-common",
    "astra-config",
]

[tool.uv.sources]
astra-common = { workspace = true }
astra-config = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/astra_logging"]
