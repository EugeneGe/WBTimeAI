[project]
name = "astra-task"
version = "0.4.0"
description = "Astra AI 任务基座（Task 状态机 + 进程内队列 + 本地调度器）"
requires-python = ">=3.12"
dependencies = [
    "astra-common",
    "astra-core",
    "astra-domain",
    "apscheduler>=3.10.0,<4",
]

[project.optional-dependencies]
# Team：Redis 任务队列（Arq）。仅此 extra 声明 arq/redis；代码内**函数级延迟导入**，
# 社区（无 extra）零新运行时依赖（W1 裁定 §3.6 / I-P2-21）。
redis = ["redis>=5.0", "arq>=0.26"]

[tool.uv.sources]
astra-common = { workspace = true }
astra-core = { workspace = true }
astra-domain = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/astra_task"]
