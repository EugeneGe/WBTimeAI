[project]
name = "astra-audit"
version = "0.4.0"
description = "Astra AI 审计抽象包（AuditSink Protocol + 基础 recorder；经注入 AuditRepository 落库；零 ORM）"
requires-python = ">=3.12"
dependencies = [
    "astra-common",
    "astra-core",
    "astra-domain",
]

[tool.uv.sources]
astra-common = { workspace = true }
astra-core = { workspace = true }
astra-domain = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/astra_audit"]
