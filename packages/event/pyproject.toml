[project]
name = "astra-event"
version = "0.4.0"
description = "Astra AI 事件总线（EventBus 抽象 + LocalEventBus + Phase 0 领域事件）"
requires-python = ">=3.12"
dependencies = [
    "astra-common",
    "astra-core",
]

[tool.uv.sources]
astra-common = { workspace = true }
astra-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/astra_event"]
