# ---------------------------------------------------------------------------
# Astra AI · 标准 / 开发模式（docker compose）
#
# 服务：api（uv 镜像）+ web（node 镜像跑 pnpm dev）+ worker + postgres + redis
# 语义：ASTRA_MODE=server（PostgreSQL + 外部中间件），与设计 §2.13 对齐。
#
#   docker compose up --build
#   前端 http://localhost:5173   后端 http://localhost:8080/docs   健康 /health
#
# ⚠️ Phase 0：`web` 以 **node 镜像跑开发态**（`pnpm dev`），**非生产镜像**；
#    生产静态托管 / Nginx 属后续阶段（不在 W4 范围）。
#
# T2-54（R1）：新增 DB / Workspace / Storage **持久卷** + worker 健康检查；
#    server 档由 build_providers 装配真实 Provider（不再 UnsupportedXxx 占位）。
# T2-56（R1）：在 T2-54 基座上追加**隔离网络** + **Egress Proxy** 服务（见文件末）。
# ---------------------------------------------------------------------------
name: astra-ai

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: astra-ai:standard
    environment:
      ASTRA_MODE: server
      ASTRA_DATABASE_URL: postgresql+psycopg://astra:astra@postgres:5432/astra
      ASTRA_SECRET_KEY: ${ASTRA_SECRET_KEY:-change-me-to-a-random-secret-at-least-32-bytes}
      ASTRA_HOST: 0.0.0.0
      ASTRA_PORT: "8080"
      ASTRA_CORS_ORIGINS: '["http://localhost:5173","http://127.0.0.1:5173"]'
      # Feature Flag 配置覆盖（最高优先级）；空 {} = 全部按注册表默认（全开）。
      ASTRA_FEATURE_FLAGS: '{}'
      # 服务器持久目录与 Storage 根（T2-55：服务端 UUID 派生；不接受客户端覆写）。
      ASTRA_DATA_DIR: /data
      ASTRA_WORKSPACE_ROOT: /var/lib/astra-ai/workspaces
    ports:
      - "8080:8080"
    volumes:
      # Storage / secrets 根（持久化，跨容器重建保留）。
      - astra-data:/data
      # Project / Attempt 工作区根（持久化）。
      - workspace-data:/var/lib/astra-ai/workspaces
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    # 健康检查：复用 Compose 档 api 的 /health 端点。
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import sys,urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/health').status == 200 else 1)\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    image: node:22-alpine
    working_dir: /app
    environment:
      VITE_API_BASE: /api/v1
      # 容器内：Vite proxy 指向 compose 网络中的 api 服务（默认本地为 127.0.0.1:8080）。
      VITE_PROXY_TARGET: http://api:8080
    command: >
      sh -c "corepack enable && pnpm install --frozen-lockfile=false && pnpm -C apps/web dev --host 0.0.0.0 --port 5173"
    volumes:
      - ./:/app
      # 匿名卷保护容器内 node_modules，避免被宿主挂载目录覆盖。
      - /app/node_modules
      - /app/apps/web/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - api

  # Team：后台任务消费者（W1 / T2-02；工程范式切换 单进程 → 多进程）。
  # 与 api 同镜像同网络；经 build_providers 装配 RedisTaskQueue + WorkerProcessExecutor，
  # 消费 agent.run / workflow.run / knowledge.index。
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: astra-ai:standard
    command: astra-worker
    environment:
      ASTRA_MODE: server
      ASTRA_DATABASE_URL: postgresql+psycopg://astra:astra@postgres:5432/astra
      ASTRA_REDIS_URL: redis://redis:6379/0
      ASTRA_SECRET_KEY: ${ASTRA_SECRET_KEY:-change-me-to-a-random-secret-at-least-32-bytes}
      ASTRA_FEATURE_FLAGS: '{}'
      ASTRA_DATA_DIR: /data
      ASTRA_WORKSPACE_ROOT: /var/lib/astra-ai/workspaces
      # Compose 档：容器级隔离 Sandbox（Worker 作为 Sandbox Runtime 管理方）。
      ASTRA_SANDBOX_PROVIDER: docker
      # T2-56：Agent Sandbox 网络隔离——接入**内部**网络（无外部路由），仅经受控 Egress Proxy 出网。
      ASTRA_SANDBOX_NETWORK_PROFILE: allowlisted
      ASTRA_SANDBOX_EGRESS_NETWORK: astra-sandbox-egress
      ASTRA_SANDBOX_EGRESS_PROXY_URL: http://egress-proxy:8888
    volumes:
      - astra-data:/data
      - workspace-data:/var/lib/astra-ai/workspaces
      # 🔴 Worker / 控制面拥有宿主 root 等价权限（设计 §2.8.1 信任级别）：
      #    仅用于 Worker 创建 / 管理 Sandbox 容器；**绝不**把该 socket 挂进 Agent Sandbox。
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      # 存活探针：Worker 进程可导入即视为健康（不触发任何任务执行）。
      test: ["CMD-SHELL", "python -c \"import astra_worker\" || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  # T2-56：受控 Egress Proxy（判定复用唯一 EgressPolicy；默认拒绝全部出网）。
  # 双网卡：内网 sandbox-egress（沙箱可达）+ 默认网（代理自身可出公网）。
  # 沙箱容器仅接入 sandbox-egress（internal: true，无外部路由），故只能经本代理出网。
  egress-proxy:
    build:
      context: .
      dockerfile: Dockerfile
    image: astra-ai:standard
    command: ["python", "-m", "astra_security.egress.proxy", "--host", "0.0.0.0", "--port", "8888"]
    environment:
      ASTRA_EGRESS__ENABLED: "true"
      # 白名单**由部署方显式配置**；默认空 = 拒绝全部出网（最小暴露面）。
      ASTRA_EGRESS__ALLOW: ${ASTRA_EGRESS_ALLOW:-[]}
      ASTRA_EGRESS__DENY_PRIVATE: "true"
    networks:
      - default
      - sandbox-egress
    # 仅内网暴露代理端口（不绑宿主端口，不对宿主机/公网开放）。
    expose:
      - "8888"

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: astra
      POSTGRES_PASSWORD: astra
      POSTGRES_DB: astra
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U astra -d astra"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"

volumes:
  postgres-data:
  redis-data:
  # T2-54：Workspace（Project / Attempt）与 Storage 持久卷（跨容器重建保留）。
  workspace-data:
  astra-data:

networks:
  # T2-56：Agent Sandbox 专用**内部**网络——`internal: true` 使其**无外部路由**；
  # 沙箱只能与同网卡（egress-proxy）通信，出网一律经受控代理（复用唯一 EgressPolicy）。
  # 若某部署不能证明网络层强制 → 保持 `network=none`（不放公网路由，A-13 / D19 / RK-6）。
  sandbox-egress:
    internal: true
  default:
    name: astra-ai-default
