[project]
name = "astra-cli"
version = "0.4.0"
description = "Astra AI 命令行（astra init / run / doctor，决策 D5）"
requires-python = ">=3.12"
dependencies = [
    "astra-config",
    "astra-database",
    "astra-api",
    # W1b / T2-05：插件 CLI 扩展装配（main.mount_plugin_commands）
    "astra-plugin",
    "typer>=0.12.0",
]

[project.scripts]
astra = "astra_cli.main:main"

[tool.uv.sources]
astra-config = { workspace = true }
astra-database = { workspace = true }
astra-api = { workspace = true }
astra-plugin = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/astra_cli"]
