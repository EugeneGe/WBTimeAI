[project]
name = "astra-api"
version = "0.4.0"
description = "Astra AI HTTP API（FastAPI 入口）"
requires-python = ">=3.12"
dependencies = [
    "astra-common",
    "astra-core",
    "astra-config",
    "astra-logging",
    "astra-database",
    "astra-domain",
    "astra-identity",
    "astra-application",
    "astra-security",
    "astra-workspace",
    "astra-memory",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
]

[tool.uv.sources]
astra-common = { workspace = true }
astra-core = { workspace = true }
astra-config = { workspace = true }
astra-logging = { workspace = true }
astra-database = { workspace = true }
astra-domain = { workspace = true }
astra-identity = { workspace = true }
astra-application = { workspace = true }
astra-security = { workspace = true }
astra-workspace = { workspace = true }
astra-memory = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/astra_api"]
