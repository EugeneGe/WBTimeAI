<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src 'self'" />
    <title>Astra AI · 连接后端</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
        background: #0b0b0f; color: #e7e7ea;
        font: 14px/1.6 -apple-system, "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
      }
      main {
        width: min(560px, 92vw); background: #14141b; border: 1px solid #26262f;
        border-radius: 12px; padding: 28px 28px 22px;
      }
      h1 { margin: 0 0 6px; font-size: 20px; }
      .lead { margin: 0 0 18px; color: #a9a9b6; }
      code { background: #1f1f29; padding: 1px 6px; border-radius: 5px; }
      .status {
        margin: 0 0 16px; padding: 10px 12px; border-radius: 8px;
        background: #191922; border: 1px solid #26262f; color: #cfcfda; font-variant-numeric: tabular-nums;
      }
      label { display: block; margin: 0 0 6px; color: #a9a9b6; }
      input {
        width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid #33333f;
        background: #0f0f15; color: #e7e7ea; outline: none;
      }
      input:focus { border-color: #6366f1; }
      .row { display: flex; gap: 10px; margin-top: 14px; }
      button {
        flex: 1; padding: 10px 14px; border-radius: 8px; border: 1px solid transparent;
        background: #6366f1; color: #fff; font-weight: 600; cursor: pointer;
      }
      button.ghost { background: transparent; border-color: #33333f; color: #cfcfda; }
      button:disabled { opacity: .6; cursor: default; }
      .hint { min-height: 20px; margin: 14px 0 0; color: #f0b429; }
      .foot { margin: 14px 0 0; color: #77778a; font-size: 12px; }
    </style>
  </head>
  <body>
    <main>
      <h1>Astra AI</h1>
      <p class="lead">未检测到可用后端。请填写远端后端地址并连接；或在本机安装 <code>astra</code>（PATH 中）后点「重试」。</p>
      <div class="status" id="status">状态：检测中…</div>

      <label for="url">远端后端地址</label>
      <input id="url" type="url" placeholder="http://192.168.1.3:8080" autocomplete="off" spellcheck="false" />

      <div class="row">
        <button id="connect">连接</button>
        <button id="retry" class="ghost">重试（本地）</button>
      </div>

      <p class="hint" id="hint"></p>
      <p class="foot">桌面壳只保存非敏感项；API Key 一律在后端设置中管理。</p>
    </main>

    <script>
      // 该页由壳内 RendererServer 在「无后端（kind=none）」时于 / 提供（同源）。
      const api = window.astraDesktop;
      const el = (id) => document.getElementById(id);
      const $status = el("status");
      const $url = el("url");
      const $hint = el("hint");
      const $connect = el("connect");
      const $retry = el("retry");

      function renderStatus(status) {
        const detail = status.detail ? `（${status.detail}）` : "";
        $status.textContent = `状态：${status.kind}${detail}`;
        if (status.baseUrl) $url.value = status.baseUrl;
      }

      // 经壳内反代探测 /health：200 即后端真实可达（比仅看 kind 更可靠）。
      async function backendReachable() {
        try {
          const res = await fetch("/health", { cache: "no-store" });
          return res.ok;
        } catch {
          return false;
        }
      }

      async function afterResolve(status) {
        renderStatus(status);
        if (await backendReachable()) {
          $hint.textContent = "已连接，正在加载界面…";
          location.reload();
          return;
        }
        $hint.textContent = "无法连接该后端：请检查地址 / 网络，或改用本机后端。";
      }

      $connect.addEventListener("click", async () => {
        const url = $url.value.trim();
        if (!url) { $hint.textContent = "请输入后端地址。"; return; }
        $connect.disabled = $retry.disabled = true;
        $hint.textContent = "连接中…";
        try {
          await afterResolve(await api.setRemote(url));
        } catch (error) {
          $hint.textContent = `出错：${error}`;
        } finally {
          $connect.disabled = $retry.disabled = false;
        }
      });

      $retry.addEventListener("click", async () => {
        $connect.disabled = $retry.disabled = true;
        $hint.textContent = "重试中…";
        try {
          await afterResolve(await api.restartBackend());
        } catch (error) {
          $hint.textContent = `出错：${error}`;
        } finally {
          $connect.disabled = $retry.disabled = false;
        }
      });

      (async () => {
        try {
          renderStatus(await api.getStatus());
        } catch (error) {
          $status.textContent = `状态：无法读取（${error}）`;
        }
      })();
    </script>
  </body>
</html>
