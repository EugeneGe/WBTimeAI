# WBTimeAI · CI（V0.0.1 建仓基线）
#
# 依据：`docs/施工纪律.md` §4.7（运行时地板口径）、`docs/V1.0/00-版本路线图.md` §7.2-15。
#
# 三条硬纪律，本文件逐条落地：
#   1. Node 三档，**全部 required**：22.19.0（地板，精确 patch）/ 24.18.1（桌面实际档）/
#      26.x（最新 LTS）。矩阵里**禁止**写 `22` / `24` 这类浮点 major —— 会被解析成该线
#      最新值 ⇒ 永远绿、测不到下界 = 假绿。
#   2. 每档必须**断言** `process.versions.node` 落在该档声明值内（防「矩阵写 22.19 实际跑 24」）。
#   3. **禁止** `continue-on-error`：任何一档红都必须让整条流水线红。
#
# 为什么本版没有 `pnpm install` / `pnpm -r test`：
#   V0.0.1 的产出是契约（`contracts/`，由 Python 抽取），按路线图 §2 与施工纪律 §4.8-3
#   本版**不写任何 TS 业务代码**，仓库里没有 workspace 子包可装、可测。此时若写
#   `pnpm -r test` 会因「无匹配包」直接失败，属于用假门禁冒充覆盖；因此本版只做两件事：
#   ① 版本断言（真实可跑、可失败）；② 契约完整性 + 基线不变量 + 文档门禁（真实可跑、可失败）。
#
#   ⚠️ 上述「无 workspace」只对 V0.0.1 成立。**V0.1.0 起 workspace 已存在**
#   （`packages/*` + `apps/*`，实测 10 个成员 = 9 个 packages + 1 个 app），
#   install / typecheck / test / lint 一律见下面的 `v010-ts` job —— 那一档才是
#   「TS 代码真的能跑」的证明，本段历史说明不构成任何豁免。
#
# 注意：契约档 `run.py check` 在 manifest 重建前会红（sha256 台账与产物不一致），
#   这是**预期门禁**而非缺陷 —— 台账由 C-07 在收口时统一重建（`run.py export`）。
#   该检查不依赖旧仓存在（`--source` 只在 export 时解析），因此在干净 runner 上可跑。

name: ci

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # 运行时地板三档：每档都断言「实际跑的 Node 就是声明的那一档」
  # ---------------------------------------------------------------------------
  runtime-floor:
    name: node ${{ matrix.node }} · ${{ matrix.tier }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # 地板：精确 patch，禁写 22
          - node: "22.19.0"
            mode: exact
            tier: floor
          # 桌面实际档 = Electron 内置 Node 精确值（与 .nvmrc 一致）
          - node: "24.18.1"
            mode: exact
            tier: desktop
          # 最新 LTS：允许 26.x 内取最新 patch
          - node: "26.x"
            mode: major
            tier: latest-lts
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Show runtime
        shell: bash
        run: |
          echo "declared=${{ matrix.node }} tier=${{ matrix.tier }}"
          node --version
          node -p "process.versions.node"

      - name: Assert runtime falls inside declared tier (anti-false-green)
        shell: bash
        env:
          DECLARED: ${{ matrix.node }}
          MODE: ${{ matrix.mode }}
        run: |
          node <<'JS'
          const declared = process.env.DECLARED || '';
          const mode = process.env.MODE || '';
          const actual = process.versions.node;
          const parts = actual.split('.').map(Number);

          // engines 区间 "^22.19.0 || >=24.0.0" 的两段式语义（不是简单 >= 地板）：
          //   >=22.19.0 <23.0.0  或  >=24.0.0
          //   22.0–22.18 与 23.x 全系不在支持范围。
          const inEngines =
            (parts[0] === 22 && (parts[1] > 19 || (parts[1] === 19 && parts[2] >= 0))) ||
            parts[0] >= 24;

          // 档位断言：exact 要求 major.minor.patch 全等；major 要求主版本相等。
          const tierOk = mode === 'exact'
            ? actual === declared
            : (mode === 'major' ? String(parts[0]) === declared.split('.')[0] : false);

          console.log(`declared=${declared} mode=${mode} actual=${actual} tier_ok=${tierOk} engines_ok=${inEngines}`);

          if (!tierOk) {
            console.error(`FAIL: runner node ${actual} does not fall inside declared tier ${declared} (mode=${mode})`);
            process.exit(1);
          }
          if (!inEngines) {
            console.error(`FAIL: runner node ${actual} is outside engines range "^22.19.0 || >=24.0.0"`);
            process.exit(1);
          }
          console.log('OK: runtime matches declared tier and engines range');
          JS

  # ---------------------------------------------------------------------------
  # 门禁：基线不变量 + 文档门禁（施工纪律 §4.6）+ 契约完整性（sha256 台账）
  # ---------------------------------------------------------------------------
  gates:
    name: baseline · docs · contracts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Baseline invariants (version / engines.node / .nvmrc / CI matrix)
        run: python scripts/check_baseline.py

      - name: Docs gate (施工纪律 §4.6 「不做」栏 ①/②/③)
        run: python scripts/check_docs.py

      - name: Contracts integrity (sha256 ledger, no legacy repo needed)
        run: python scripts/extract-from-py/run.py check

      # 语义门禁：从产物重新计算数字并与 criteria 比对（纯 sha256 门禁查不出「改数字 + 同步重钉 sha」）。
      # 两者职责不同，缺一不可：
      #   run.py check           → 证明「文件没被偷改」
      #   verify_semantics.py    → 证明「数字是对的」
      - name: Contracts semantics (recompute from artifacts, not from ledger)
        run: python scripts/verify_semantics.py

      # R3-00-②：verify_semantics 证「数字对」，本条证「结构语义没被重排改坏」——
      # v0019 登记时 contract-manifest.json 全量重排（+3315/−3259），字节门禁只能发现变化、
      # 不能区分「重排」与「删改」。断言 objects 48 / 新增 7 条全含 v0019 / 删除 0 /
      # 其余 7 个顶层集合计数不变 / classification_rules pattern 集合与基线相等。
      - name: R3-00-② contract-manifest semantic equivalence (rearrange-safe)
        run: python scripts/check_manifest_semantics.py
      - name: R3-00-② manifest-semantics detector self-test (5 injections)
        run: python scripts/check_manifest_semantics.py --self-test

      # 下面两条是 V0.1.0 审计补的门禁（M-4 / B-1），职责与上面的契约档不重叠：
      #   前者证明「i18n 两语言键集真的对等」，后者证明「TS 侧错误码字面量真的来自契约」。
      # 两者都带 --self-test：先证明检测器会红，再用它判绿（只绿不红 = 没有门禁）。
      - name: M-4 · i18n key parity (en ↔ zh-CN, placeholders included)
        run: python scripts/check_i18n_keys.py
      - name: M-4 · i18n detector self-test (missing / extra / placeholder / duplicate)
        run: python scripts/check_i18n_keys.py --self-test
      - name: B-1 · TS error codes ≡ contracts/errors.json
        run: python scripts/check_error_codes.py
      - name: B-1 · error-code detector self-test (unknown / drift / status drift / empty)
        run: python scripts/check_error_codes.py --self-test

      # 措辞红线：§8.1 的三条裁定（D-1 / D-4 / D-5）规定了台账必须写、且不得放宽的措辞。
      # 此前只靠人读，而 check_docs.py 只扫 `01-计划/README.md` 的「不做」栏、
      # 且 V0.0.2 在 EXEMPT_VERSIONS 里 ⇒ 对本版措辞零证明力（QA 复核 F-6）。
      # 这条门禁的 W-4 已用两个注入自证会红（删 PARTIAL / 加放宽结论）。
      - name: Wording redlines (D-1 / D-4 / D-5 must be written and not weakened)
        run: python scripts/check_wording_redlines.py

  # ---------------------------------------------------------------------------
  # V0.0.2 新增：4 个离线门禁 job（DoD#1/#2/#3/#6 + S-1）。
  #
  # 全部 **required**：任何一红 ⇒ 流水线红。**禁止** `continue-on-error`、
  # **禁止** `|| true`（等同 continue-on-error），这与本版主张一致：
  # 「门禁必须会红，红得有理由」。
  #
  # 关于 `E2E_LEGACY_ROOT` 的条件：
  #   本版有 3 条门禁的**真值来源**是只读旧仓 `_old`（外部 oracle：F1 paths /
  #   F2 ddl / F3 sse / F4 errors）。干净 runner 上 `_old` 不存在 ⇒ 它们只能返回
  #   「oracle 不可得」而不是绿（`oracle_recompute` = 21、`meta_gate` 第 2 探针 =
  #   UNEVALUABLE、`inject` 的 ATK-2 用例 = 12）。把它们写成「跑但必红」等于让仓库
  #   长期常红，而长期常红**必然**诱导后人加 `continue-on-error` —— 那正是本版要消灭
  #   的东西（`02-施工/README.md` §8.1 D-2 的同一理由）。
  #   ⇒ 处理方式与 `selfproof.yml` 一致：**未配置 `vars.E2E_LEGACY_ROOT` 时整个 job
  #     不进矩阵**（run summary 显示缺席，台账记 BLOCKED），一旦配置则 **required**。
  #   `frontend-baseline`（S-1）完全自足，**无条件 required**。
  # ---------------------------------------------------------------------------
  v002-frontend-baseline:
    name: S-1 frontend baseline (frontend-baseline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: S-1 · per-root three-state scan + MIN_FILES floor
        run: python scripts/check_frontend_baseline.py
      - name: S-1 · injected counter-examples (msw / empty glob / missing registration / exclusion / floor)
        run: python scripts/check_frontend_baseline.py --self-test
      - name: S-1 · 口径 X (--strict) must be red, proving both stances really move
        shell: bash
        run: |
          set +e
          python scripts/check_frontend_baseline.py --strict
          code=$?
          set -e
          echo "strict exit=$code"
          if [ "$code" -ne 1 ]; then
            echo "FAIL: --strict must exit 1 (口径 X: contracts/frontend-baseline/** is absent)"
            exit 1
          fi

  v002-injection:
    name: DoD#1/#2/#3 counter-examples (injection)
    runs-on: ubuntu-latest
    if: ${{ vars.E2E_LEGACY_ROOT != '' }}
    env:
      E2E_LEGACY_ROOT: ${{ vars.E2E_LEGACY_ROOT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Injection engine · every named tamper must turn its gate red
        run: python scripts/inject_counterexample.py --all
      - name: Injection engine · self-test
        run: python scripts/inject_counterexample.py --self-test

  v002-oracle:
    name: N-2 external oracle (oracle)
    runs-on: ubuntu-latest
    if: ${{ vars.E2E_LEGACY_ROOT != '' }}
    env:
      E2E_LEGACY_ROOT: ${{ vars.E2E_LEGACY_ROOT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: External oracle · artifacts must match the read-only legacy tree
        run: python scripts/oracle_recompute.py --oracle legacy

  v002-meta:
    name: S-7 meta gate (meta)
    runs-on: ubuntu-latest
    if: ${{ vars.E2E_LEGACY_ROOT != '' }}
    env:
      E2E_LEGACY_ROOT: ${{ vars.E2E_LEGACY_ROOT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Meta gate · every gate must notice it was mutated into green
        run: python scripts/meta_gate.py
      - name: Meta gate · classifier self-test
        run: python scripts/meta_gate.py --self-test

  # ---------------------------------------------------------------------------
  # V0.1.0 门禁（数据层 + 域 + 契约层 + 前端 0 改动）
  #
  # 拆成两个 job 是有意的，不是遗漏：
  #   * `v010-gates` 只跑**不依赖旧仓归档**的门禁，任何 runner 上都能红能绿；
  #   * `v010-frontend-diff` 需要 `_old/apps/web/src/**`（⑤-a 的逐文件 hash 基准），
  #     干净 runner 上没有该归档 ⇒ 沿用本文件既有惯例，用 `E2E_LEGACY_ROOT`
  #     条件显式表达「依赖不可得时不跑」，**而不是假装跑过**。
  # ⑤-a 在本地与「迁入 commit 落地后」的 `git diff` 判据承担，详见
  # `docs/V1.0/V0.1.0-基座与契约层/03-台账/DoD-V0.1.0.md` §3。
  # ---------------------------------------------------------------------------
  v010-gates:
    name: v0.1.0 gates (no legacy tree needed)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22.19.0"
          cache: pnpm
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install workspace
        run: pnpm install --frozen-lockfile
      - name: Assert the matrix leg really runs the declared Node
        run: node -e "const v=process.versions.node; if(!v.startsWith('22.19.0')){console.error('expected 22.19.0, got '+v);process.exit(1)}"
      - name: T1-08 · page lighting matrix ≡ router
        run: python scripts/check_page_matrix.py
      - name: T1-02 · platform parity (errors / envelope / sse)
        run: python scripts/check_platform_parity.py
      - name: T1-04 · extension points ≡ legacy Protocol
        run: python scripts/check_extension_point_signatures.py
      - name: T1-06 · layering rules (3 rules, injections proven red)
        run: node scripts/check_depcruiser.mjs
      # ``output/`` is git-ignored on purpose (it holds regenerable artifacts), so a
      # clean clone has no ``drizzle-introspect.*.json`` and the parity gate would
      # fail with "USAGE/LOAD FAIL".  Regenerate it from source first — the gate
      # itself refuses to fabricate a regression rather than passing vacuously.
      - name: T1-03 · regenerate runtime introspection (output/ is git-ignored)
        run: pnpm --filter @wbtime/db introspect
      - name: T1-03 · drizzle DDL parity (dual dialect)
        run: python scripts/check_drizzle_parity.py

  # ---------------------------------------------------------------------------
  # V0.1.0 · TS 档：install / test / typecheck / lint
  #
  # 为什么必须单独一档（而不是塞进 v010-gates）：
  #   `v010-gates` 是「离线门禁」档，靠 Python 比对产物与契约，**从不编译 TS**。
  #   一个 workspace 里所有 TS 都编译不过、所有单测都红，`v010-gates` 依然可以全绿 ——
  #   这就是审计 D-1 记的「测试/类型/lint 档缺失」。本档补的正是那条证据链：
  #   packages 单测（排除需要真服务的 e2e 与前端）→ packages 类型 → 前端单测 →
  #   前端类型 → 前端 lint。
  #
  # 为什么排除 `@wbtime/e2e` 与 `@wbtime/web` 的第一批命令：
  #   e2e 需要真实后端进程，本档不带服务起；web 的测试是 vitest（需要 jsdom），
  #   与 node:test 不是同一套 runner，故各用各的命令，不混在一个 `-r` 里假装统一。
  #
  # 全部 **required**：禁止 `continue-on-error`、禁止 `|| true`。
  #
  # 本档另外负责一件**证明**：T2-04 · J-2②「TS 生成的 PHC 串 → py verify == true」。
  # 那条用例是 fail loud 的（没设 `WBTIME_PY_ORACLE_PYTHON` 就红），所以本档在跑单测
  # **之前**装 python + argon2-cffi 并把解释器绝对路径注入环境变量 —— 即「真跑」，
  # 而不是用 `WBTIME_ALLOW_MISSING_PY_ORACLE=1` 把跳过当通过。
  # ---------------------------------------------------------------------------
  v010-ts:
    name: v0.1.0 ts (install · test · typecheck · lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22.19.0"
          cache: pnpm
      - name: Install workspace
        run: pnpm install --frozen-lockfile
      - name: Assert the runner really runs the declared Node
        run: node -e "const v=process.versions.node; if(!v.startsWith('22.19.0')){console.error('expected 22.19.0, got '+v);process.exit(1)}"
      # J-2② 的 py oracle（T2-04）—— 选「真跑」而不是「显式允许跳过」
      # ------------------------------------------------------------------
      # `apps/api/tests/auth-password.test.mjs` 的 J-2② 是 **fail loud** 的：
      # `WBTIME_PY_ORACLE_PYTHON` 是**唯一**接受来源，没设就红（不再静默 `# SKIP`）。
      # 这里必须把它设成一个真装了 argon2-cffi 的解释器，否则本档单测必红。
      #
      # 为什么不用 `WBTIME_ALLOW_MISSING_PY_ORACLE=1` 放行：那等于把「等效性证明」
      # 降级成「声明」，与铁律「禁冒充实证」冲突。多花 ~15s 装个 wheel 就能真跑。
      #
      # 需要什么/不需要什么：oracle 程序**内嵌在测试文件里**
      # （`PY_ORACLE_PROGRAM`，是 py 线 helper 的 verify 分支逐字拷贝），
      # 所以 CI **不需要** `WBTimeAI_old` 仓，只需要「解释器 + argon2-cffi」。
      #
      # 版本对齐本机基准环境（py 3.12.10 / argon2-cffi 25.1.0）：argon2 的 PHC 参数
      # （m=65536,t=3,p=4）跨版本稳定，但把解释器小版本钉住能让失败可复现。
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install py oracle deps (argon2-cffi) and expose WBTIME_PY_ORACLE_PYTHON
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install "argon2-cffi==25.1.0"
          # 用解释器**绝对路径**注入（不是裸 `python`）：跨 step 时工作目录/venv 都可能变，
          # 绝对路径让"到底跑了哪个解释器"在日志里可以直接看到。
          PY_ORACLE="$(python -c 'import sys; print(sys.executable)')"
          echo "WBTIME_PY_ORACLE_PYTHON=${PY_ORACLE}" >> "$GITHUB_ENV"
          "${PY_ORACLE}" -c "import sys, importlib.metadata as m; print('py oracle:', sys.version.split()[0], '| argon2-cffi', m.version('argon2-cffi'), '|', sys.executable)"
      - name: packages · unit tests (e2e / web excluded)
        run: pnpm -r --filter "!@wbtime/e2e" --filter "!@wbtime/web" test
      - name: packages · typecheck
        run: pnpm -r --filter "!@wbtime/e2e" --filter "!@wbtime/web" typecheck
      # R-7：apps/web 全量 vitest 有**既有**资源争抢型 flake —— 默认 testTimeout=5000ms，
      # 全量跑时 setup/environment 开销会把长用例推到临界（两轮 500/502，失败集合每次不同，
      # 单文件复跑全绿）。故 `--retry=1` 只吸收时序抖动：**确定性失败第二次仍红**，
      # 它不是 continue-on-error，也不放宽任何断言。根治（显式 testTimeout / 收敛 pool）
      # 需改 `apps/web/vitest.config.ts`，属本版硬边界（前端 0 改动），留给 V0.8.0。
      - name: web · unit tests (vitest)
        run: pnpm --filter @wbtime/web test -- --retry=1
      - name: web · typecheck
        run: pnpm --filter @wbtime/web typecheck
      - name: web · lint
        run: pnpm --filter @wbtime/web lint

  v010-frontend-diff:
    name: v0.1.0 ⑤-a frontend diff (needs legacy tree)
    runs-on: ubuntu-latest
    if: ${{ vars.E2E_LEGACY_ROOT != '' }}
    env:
      E2E_LEGACY_ROOT: ${{ vars.E2E_LEGACY_ROOT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: ⑤-a · apps/web/src/** must be byte-identical to the archive
        run: python scripts/check_frontend_diff.py --legacy-root "$E2E_LEGACY_ROOT"

  # ---------------------------------------------------------------------------
  # V0.2.0 · TS 集成档：冒烟（真进程真端口）+ I-1 conformance（跨租户 404）
  #
  # 为什么必须单独一档（审计 #3 / FIX-03）：
  #   上面所有 job 都**没有**执行过 `packages/e2e/tests/ts-backend/**` 与
  #   `packages/e2e/tests/conformance/*.cases.mjs`。前者被 `--filter "!@wbtime/e2e"`
  #   整体排除，后者根本没被任何 glob 匹配（`*.cases.mjs` ≠ `*.test.mjs`）。
  #   结果是「TS 后端真的能起进程、真的能过 TCP、跨租户真的 404」这三件事**零证据**。
  #
  # 三条纪律：
  #   1. **禁 `continue-on-error`**、禁 `|| true`：红就是红。
  #   2. **执行数断言**：`scripts/run-smoke.mjs` / `scripts/run-conformance.mjs` 会解析
  #      TAP 的 `# pass N`，N < 下界（4 / 11）即 exit 1 —— 消灭「glob 匹配 0 文件仍
  #      exit 0」的假绿形态。所以本 job **不直接**调 `node --test`，一律走 runner。
  #   3. **conformance 夹具显式注入**：runner 用 `pathToFileURL` 生成
  #      `WBTIME_CONFORMANCE_HARNESS`（`file://` 绝对 URL），不依赖调用方记得加环境变量；
  #      未注入时 8 个 case 会 assert.fail（红），不是 skip。
  #
  # Node 版本与 `v010-ts` 一致（22.19.0 = engines 地板），不做版本漂移。
  # `output/ddl.sqlite.sql` 是 git-ignored 的可再生产物，但冒烟/conformance 夹具都直接读它
  # ⇒ 先用 `@wbtime/db` 的 build 链把它生成出来（与 `v010-gates` 的 introspect 同一手法）。
  # ---------------------------------------------------------------------------
  ts-integration:
    name: v0.2.0 ts integration (smoke · conformance)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22.19.0"
          cache: pnpm
      - name: Install workspace
        run: pnpm install --frozen-lockfile
      - name: Assert the runner really runs the declared Node
        run: node -e "const v=process.versions.node; if(!v.startsWith('22.19.0')){console.error('expected 22.19.0, got '+v);process.exit(1)}"
      # 构建 apps/api 及其 workspace 依赖（config / core / db / domain / event / logging / security）。
      # `...` 后缀 = 「本包 + 它的依赖」，顺序由 pnpm 拓扑排序保证。
      - name: Build @wbtime/api and its dependencies
        run: pnpm --filter "@wbtime/api..." build
      # 夹具（ts-backend/_backend.mjs、conformance/harness.mjs）都读 output/ddl.sqlite.sql；
      # 该文件 git-ignored（可再生），干净 runner 上必须先生成，否则套件会红在"DDL 不存在"
      # —— 那是环境的红，不是被测行为的红。`--source model` 零第三方依赖（install 后亦可）。
      - name: Regenerate output/ DDL (git-ignored, needed by fixtures)
        run: node scripts/gen-ddl.ts
      - name: Smoke · ts-backend over real TCP (case count asserted by runner)
        run: pnpm test:smoke
      # runner 自身的红证：判据（文件级通过识破 / E2E_LEG 回归）不退化才算门禁有效。
      # 零依赖（不需要 py / PG / 构建），1 秒内跑完 —— 所以放在 Smoke 之后、Conformance 之前，
      # 让"判据坏了"比"用例红了"先报出来。独立 step（不并进 `&&` 链）：否则两类失败在日志里
      # 混成一行，排查时得数 exit code。
      - name: Runner self-test · 判据不退化（文件级通过 / E2E_LEG 回归）
        run: node scripts/run-all.mjs --self-test
      - name: Conformance · I-1 cross-tenant 404 (11 cases, harness injected)
        run: pnpm test:conformance

  # ---------------------------------------------------------------------------
  # V0.2.0 · 安全门禁（审计 #6 / FIX-08）
  #
  # 补的是「CI 零 SAST/SCA」里**本版能真落地**的那两半：
  #   1. `scripts/gate-secrets.mjs` —— 对 `git ls-files` 的文本文件扫 5 类高频凭据形态
  #      （PEM 私钥块 / AWS / GitHub / Slack / 凭据明文字面量），逐条 allowlist 带理由；
  #   2. `scripts/audit-gate.mjs` —— `pnpm audit --prod` 的 high+critical 必须为 0；
  #      全量 audit **仅报告**（`apps/web` devDeps 受 Q-5 冻结，升级不在 1.0）。
  #
  # 两件事本 job **不**做，且文档里不许写成做过了：
  #   * 不引 semgrep / gitleaks 二进制（离线不可得、许可不确定）—— 本仓的扫描器是规则扫描，
  #     **不是** gitleaks 等价物（不扫 git 历史、不做熵分析）；
  #   * 不把「audit 端点不可达」当通过：`audit-gate` 对此返回 exit 2，本 job 因此红。
  #
  # 两条纪律与全文件一致：**禁** `continue-on-error`、**禁** `|| true`。
  # 两个 `--self-test` 不是装饰：它们用内置夹具证明「判据会红」——
  # 没有红证的扫描器，跑出来的绿只能证明"它没报错"。
  # ---------------------------------------------------------------------------
  security:
    name: v0.2.0 security (secrets · audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22.19.0"
          cache: pnpm
      - name: Install workspace
        run: pnpm install --frozen-lockfile
      - name: Assert the runner really runs the declared Node
        run: node -e "const v=process.versions.node; if(!v.startsWith('22.19.0')){console.error('expected 22.19.0, got '+v);process.exit(1)}"
      # 顺序刻意：先自证检测器会红，再用它判绿。反过来做，「绿」既可能真绿，也可能检测器坏了。
      - name: Secrets · detector self-test (5 rules must go red, clean file must stay green)
        run: node scripts/gate-secrets.mjs --self-test
      - name: Secrets · scan tracked files (allowlist is per-file, with reason + owner)
        run: node scripts/gate-secrets.mjs
      - name: Audit · decision self-test (blocking fixture ⇒ exit 1, clean ⇒ exit 0)
        run: node scripts/audit-gate.mjs --self-test
      - name: Audit · prod high+critical must be 0 (full audit is report-only, never fails)
        run: node scripts/audit-gate.mjs

