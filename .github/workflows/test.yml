# ---------------------------------------------------------------------------
# Astra AI · Test（T0-23 / §2U.3）
#
# 验收 §3-#13 的 test 面：迁移双向 + 单测/集成（SQLite）+ 双引擎冒烟（PG + 迁移
# roundtrip）+ 社区启动冒烟 + 前端构建 + 前端单测（vitest，T1-01 / P0-09）。
#
# 防假绿（§2U.3 关键点 ④）：postgres-smoke 设 ASTRA_TEST_REQUIRE_PG=1，
# PG 不可用即 pytest.fail（非 skip）。
# D4 固化（§2U.8）：python-test 跑 tests/unit/test_config_mode_branch.py。
# ---------------------------------------------------------------------------
name: test

# 最小权限（least privilege）：仅读取仓库内容，防止工作流被滥用提权。
permissions:
  contents: read

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-test:
    name: Python tests (migrations + pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ASTRA_MODE: local
      ASTRA_SECRET_KEY: ci-secret-key-0123456789abcdef-32bytes
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup uv (Python 3.12)
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Sync workspace (locked)
        run: uv sync --locked --all-packages --all-extras

      - name: Migration roundtrip (upgrade head -> check -> downgrade base)
        run: |
          export ASTRA_DATABASE_URL="sqlite:///$(pwd)/ci_migration.db"
          uv run alembic upgrade head
          uv run alembic check
          uv run alembic downgrade base

      # W10 / T2-51（加性）· P2.7-A：SQLite 侧迁移 head 守卫——**动态**断言「恰好单 head」并打印 head 名
      # （不再硬编 revision，后续新增迁移无需改本 YAML；对齐设计 C-4「陈测试漂移断言治理」）。
      - name: Migration head guard (SQLite, single head)
        run: |
          export ASTRA_DATABASE_URL="sqlite:///$(pwd)/ci_migration.db"
          heads="$(uv run alembic heads)"
          echo "$heads"
          [ "$(echo "$heads" | grep -c '(head)')" -eq 1 ] || { echo "::error::expected exactly 1 alembic head, got: $heads"; exit 1; }

      - name: D4 guard (mode branch only in providers.py)
        run: uv run pytest tests/unit/test_config_mode_branch.py -q

      - name: Pytest (unit + integration；NFR 基线见 nightly nfr.yml)
        run: |
          uv run pytest -q -o tmp_path_retention_policy=all --ignore=tests/nfr \
            --cov-report=term-missing --cov-report=xml:coverage.xml

      # J-4（V0.4.1）：产出并归档覆盖率报告（**仅报数、不设门**，见裁定 §4 J-4）。
      # `--cov=packages --cov=apps` 已并入 `pyproject.toml` 的 addopts；此处只加报告格式。
      # `if-no-files-found: error`：报告缺失即红，防「报告未产出」被静默吞掉（非假绿）。
      - name: Upload coverage report (J-4)
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: error

  scans:
    name: Scans (layering / open-source / credential / ID / D4)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ASTRA_MODE: local
      ASTRA_SECRET_KEY: ci-secret-key-0123456789abcdef-32bytes
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup uv (Python 3.12)
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Sync workspace (locked)
        run: uv sync --locked --all-packages --all-extras

      # G1 必绿门禁（总纲 §13.3）：五类扫描 + D4 guard 合并为**单一必绿**步骤，
      # 禁 continue-on-error / `|| true` / 无条件 skip；任一扫描违反即整体红。
      - name: Five scans + D4 guard
        run: |
          uv run pytest \
            tests/integration/test_layering.py \
            tests/integration/test_open_source.py \
            tests/integration/test_credential_scan.py \
            tests/integration/test_id_convention.py \
            tests/integration/test_secret_scan.py \
            tests/unit/test_config_mode_branch.py \
            -q

      # W10 / T2-51（加性）：纪律扫描**单入口**（分层 / 开源 / 凭证，AST + 正则）。
      # 与上方五类扫描互补；脚本退出码非 0 即整体红（与 §2.17 纪律扫描口径一致）。
      - name: Discipline scan (layering / open-source / credential)
        run: uv run python scripts/scan_discipline.py

      # J-2（V0.4.1）：manual 验收证据归档校验（设计 §13.1「无证据不得通过」）。
      # 口径：声称通过但「证据缺失 / 引用不存在 / 0 字节」→ 违规（退出码非 0）；「显式未留证」= 已披露。
      # 🔴 docs 为**独立仓**（主仓 CI 无 docs 素材）：脚本对「素材未挂载」**明示提示并跳过**
      #   （退出码 0，非假绿；不写 `|| true`）。docs 存在时（含本地 / docs 仓 CI）真校验。
      - name: Manual evidence archive check (J-2)
        run: uv run python scripts/check_manual_evidence.py --root .

  postgres-smoke:
    name: PostgreSQL smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: astra
          POSTGRES_PASSWORD: astra
          POSTGRES_DB: astra
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      ASTRA_TEST_PG_URL: postgresql+psycopg://astra:astra@localhost:5432/astra
      ASTRA_TEST_REQUIRE_PG: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup uv (Python 3.12)
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Sync workspace (locked, incl. postgres extra)
        run: uv sync --locked --all-packages --all-extras

      # plain 档（降级形态）冒烟：本 job 用 plain postgres:16（无 vector 扩展 / 无 pgvector 包），
      # 0013/0014 走**设计内降级路径**（列型 jsonb）→ `alembic check` 必然报 embedding.vector /
      # memory.vector 两项 modify_type 漂移。故此处以**降级感知**断言（严格白名单：恰好这 2 项
      # 已知差异才放行，多 1 项即 fail）替代裸零漂移判定。标准档（pgvector）的**零漂移**由
      # 同 workflow 的「PostgreSQL (pgvector) migration + knowledge」job 完整覆盖。
      - name: PostgreSQL migration roundtrip (plain 档冒烟：upgrade -> 降级感知 check -> downgrade)
        env:
          ASTRA_MODE: server
          ASTRA_SECRET_KEY: ci-secret-key-0123456789abcdef-32bytes
        run: |
          export ASTRA_DATABASE_URL="$ASTRA_TEST_PG_URL"
          uv run alembic upgrade head
          uv run python scripts/ci_check_migration_drift.py
          uv run alembic downgrade base

      # W10 / T2-51（加性）· P2.7-A：PG 权威侧迁移 head 守卫——**动态**断言「恰好单 head」并打印 head 名
      # （不再硬编 revision；双引擎冒烟之 PG 路，alembic check 口径）。
      - name: PostgreSQL migration head guard (single head)
        env:
          ASTRA_MODE: server
          ASTRA_SECRET_KEY: ci-secret-key-0123456789abcdef-32bytes
        run: |
          export ASTRA_DATABASE_URL="$ASTRA_TEST_PG_URL"
          heads="$(uv run alembic heads)"
          echo "$heads"
          [ "$(echo "$heads" | grep -c '(head)')" -eq 1 ] || { echo "::error::expected exactly 1 alembic head, got: $heads"; exit 1; }

      - name: PostgreSQL smoke test
        run: uv run pytest tests/integration/test_postgres_smoke.py -q -ra

  postgres-pgvector:
    name: PostgreSQL (pgvector) migration + knowledge
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: astra
          POSTGRES_PASSWORD: astra
          POSTGRES_DB: astra
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      ASTRA_TEST_PG_URL: postgresql+psycopg://astra:astra@localhost:5432/astra
      ASTRA_TEST_REQUIRE_PG: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup uv (Python 3.12)
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Sync workspace (locked, incl. postgres extra)
        run: uv sync --locked --all-packages --all-extras

      # pgvector Python 包**不在**依赖中（架构裁定：不加入 astra-database[postgres] ——
      # 否则 CI 的 postgres:16 会因「迁移降级 JSON ↔ ORM 期望 vector」触发新漂移）。
      # 本 job 用 pgvector/pgvector:pg16 提供扩展，并**仅在此 job** 经 `uv run --with` 注入
      # pgvector，令 VectorType 渲染 vector(d) 并触发 0013/0014 的 hnsw 建索引 —— 与权威部署一致。
      - name: PG(pgvector) migration roundtrip (upgrade -> check -> downgrade)
        env:
          ASTRA_MODE: server
          ASTRA_SECRET_KEY: ci-secret-key-0123456789abcdef-32bytes
        run: |
          export ASTRA_DATABASE_URL="$ASTRA_TEST_PG_URL"
          uv run --with 'psycopg[binary]' --with pgvector alembic upgrade head
          uv run --with 'psycopg[binary]' --with pgvector alembic check
          uv run --with 'psycopg[binary]' --with pgvector alembic downgrade base

      # 覆盖本机无法复现的权威面：迁移双向 + 真实 pgvector 余弦召回（C2-31）+ NFR PG 基线（P2-105）。
      - name: PG-gated tests (migrations / knowledge recall / NFR baselines)
        run: |
          uv run --with 'psycopg[binary]' --with pgvector pytest \
            tests/integration/migrations \
            tests/integration/knowledge \
            tests/integration/test_postgres_smoke.py \
            tests/nfr/test_pg_baselines.py \
            -q -ra

  community-smoke:
    name: Community smoke (astra init/run + /health)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup uv (Python 3.12)
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Sync workspace (locked)
        run: uv sync --locked --all-packages --all-extras

      - name: Community smoke script
        run: bash scripts/smoke_community.sh

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Frontend tests (vitest)
        run: pnpm --filter @astra/web test

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

  # G-2（V0.4.1）：桌面壳 renderer-server 的 SSE / `/redoc` 单测进常规回归。
  # desktop 为**独立 npm 栈**（不在 pnpm workspace / 非 Python 包）→ 单独 job。
  # 🔴 防假绿：`node --test` 失败即 job 红（不得 continue-on-error / `|| true`）。
  desktop-test:
    name: Desktop shell (tsc + node --test)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      # `--ignore-scripts`：跳过 `electron` 的二进制下载（仅运行期需要；tsc 类型检查
      # 用 npm 包内 `.d.ts`，`node --test` 仅依赖 `node:` 内建——均不需要该二进制）。
      - name: Install (npm ci, ignore scripts)
        working-directory: apps/desktop
        run: npm ci --ignore-scripts

      - name: Build (tsc)
        working-directory: apps/desktop
        run: npm run build

      - name: Test (node --test)
        working-directory: apps/desktop
        run: node --test "out/**/*.test.js"
